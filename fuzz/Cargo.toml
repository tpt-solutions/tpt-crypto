[package]
name = "tpt-crypto-fuzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Fuzzing harness for tpt-crypto attacker-controlled decoders"
publish = false

[dependencies]
tpt-crypto-aead = { path = "../crates/tpt-crypto-aead", default-features = false, features = ["std"] }
tpt-crypto-kem = { path = "../crates/tpt-crypto-kem", default-features = false, features = ["std"] }
tpt-crypto-sig = { path = "../crates/tpt-crypto-sig", default-features = false, features = ["std"] }
tpt-crypto-curve = { path = "../crates/tpt-crypto-curve", default-features = false, features = ["std"] }
tpt-crypto-zk = { path = "../crates/tpt-crypto-zk", default-features = false, features = ["alloc"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "aes_gcm_decrypt"
path = "fuzz_targets/aes_gcm_decrypt.rs"
test = false
doc = false

[[bin]]
name = "chacha20poly1305_decrypt"
path = "fuzz_targets/chacha20poly1305_decrypt.rs"
test = false
doc = false

[[bin]]
name = "ml_kem_decaps"
path = "fuzz_targets/ml_kem_decaps.rs"
test = false
doc = false

[[bin]]
name = "point_decompress"
path = "fuzz_targets/point_decompress.rs"
test = false
doc = false

[[bin]]
name = "signature_verify"
path = "fuzz_targets/signature_verify.rs"
test = false
doc = false

[[bin]]
name = "ecdsa_der_parse"
path = "fuzz_targets/ecdsa_der_parse.rs"
test = false
doc = false

[[bin]]
name = "ecdsa_public_key_parse"
path = "fuzz_targets/ecdsa_public_key_parse.rs"
test = false
doc = false

[[bin]]
name = "range_proof_parse"
path = "fuzz_targets/range_proof_parse.rs"
test = false
doc = false

[package.metadata]
cargo-fuzz = true
