[package]
name = "tpt-crypto-examples"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tpt-crypto-core = { path = "../crates/tpt-crypto-core", default-features = true }
tpt-crypto = { path = "../crates/tpt-crypto", default-features = false, features = ["pq", "classical", "bls", "std"] }

# MIT OR Apache-2.0 / ISC — `CryptoProvider` example: TLS 1.3 with the
# substrate's own AEADs, X25519, HKDF and Ed25519 (no ring / aws-lc-rs:
# built with default-features = false and a fully custom provider).
rustls = { version = "0.23", default-features = false, features = ["std"] }
# MIT OR Apache-2.0 — system randomness for the provider's SecureRandom
getrandom = "0.2"

[dev-dependencies]
proptest = "1"
