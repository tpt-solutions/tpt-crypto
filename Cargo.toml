[workspace]
resolver = "2"
members = ["crates/*", "xtask", "examples"]

[workspace.package]
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
homepage = "https://github.com/tpt-solutions/tpt-crypto"
repository = "https://github.com/tpt-solutions/tpt-crypto"
version = "0.1.0"
description = "High-assurance, constant-time cryptographic substrate (pure Rust, no_std-first)."

[workspace.dependencies]
tpt-crypto-core = { version = "0.1.0", path = "crates/tpt-crypto-core", default-features = false }
tpt-crypto-ct = { version = "0.1.0", path = "crates/tpt-crypto-ct", default-features = false }
tpt-crypto-kem = { version = "0.1.0", path = "crates/tpt-crypto-kem", default-features = false }
tpt-crypto-field = { version = "0.1.0", path = "crates/tpt-crypto-field", default-features = false }
tpt-crypto-hash = { version = "0.1.0", path = "crates/tpt-crypto-hash", default-features = false }
digest = { version = "0.10", default-features = false }
proptest = "1"

# NOTE: `unsafe_code = "forbid"` is the workspace default. `tpt-crypto-ct` is
# the single documented exception (its `arch` module). See SECURITY.md and the
# crate's own `Cargo.toml`, which opts out of `lints.workspace`.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
