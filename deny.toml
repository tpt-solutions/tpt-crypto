# cargo-deny configuration — license / security / dependency hygiene.
# See https://embarkstudios.github.io/cargo-deny/
#
# tpt-crypto is a pure-Rust, no_std-first cryptographic substrate. No C-FFI
# (`*-sys`), OpenSSL, or `ring` dependencies are permitted (enforced by the
# `[bans]` section). Every dependency must be MIT/Apache-compatible.

[advisories]
version = 2
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"
# No C-FFI / prebuilt-binary crypto backends allowed in this substrate.
deny = [
    "openssl",
    "openssl-sys",
    "ring",
    "ring-sys",
    "wolfssl-sys",
    "botan",
    "botan-sys",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
