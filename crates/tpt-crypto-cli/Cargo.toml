[package]
name = "tpt-crypto-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line front end to tpt-crypto: hashing, Ed25519 signing, symmetric sealing and self-test."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-crypto-cli"
keywords = ["cryptography", "cli", "signature", "encryption"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "tpt-crypto"
path = "src/main.rs"

[dependencies]
tpt-crypto = { workspace = true, features = ["std", "classical", "os-rng", "pq"] }

[lints]
workspace = true
