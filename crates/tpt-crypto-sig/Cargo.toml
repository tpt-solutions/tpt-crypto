[package]
name = "tpt-crypto-sig"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Constant-time signatures: ML-DSA (FIPS 204), SLH-DSA (FIPS 205), Ed25519 (RFC 8032), ECDSA P-256/P-384. no_std, pure Rust."
readme = "README.md"
documentation = "https://docs.rs/tpt-crypto-sig"
keywords = ["crypto", "signature", "ml-dsa", "ecdsa", "no-std"]
categories = ["cryptography", "no-std"]

[dependencies]
tpt-crypto-core = { workspace = true }
tpt-crypto-ct = { workspace = true }
tpt-crypto-hash = { workspace = true }
tpt-crypto-field = { workspace = true }
tpt-crypto-curve = { workspace = true }

[features]
default = ["std"]
std = ["tpt-crypto-core/std", "tpt-crypto-hash/std", "alloc"]
alloc = [
    "tpt-crypto-core/alloc",
    "tpt-crypto-hash/alloc",
    "tpt-crypto-field/alloc",
    "tpt-crypto-curve/alloc",
]
signature = []
slh-dsa = ["alloc"]
rand_core = ["tpt-crypto-core/rand_core"]

[dev-dependencies]
tpt-crypto-core = { path = "../tpt-crypto-core", default-features = false, features = ["std"] }
tpt-crypto-hash = { path = "../tpt-crypto-hash", default-features = false, features = ["std"] }
hex = "0.4"

[[test]]
name = "ml_dsa_kat"
required-features = []

[[test]]
name = "ml_dsa_props"
required-features = []

[[test]]
name = "slh_dsa_kat"
required-features = ["slh-dsa"]

[[bench]]
name = "sig_bench"
harness = false
required-features = ["std"]

[lib]
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
