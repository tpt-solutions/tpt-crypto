[package]
name = "tpt-crypto-curve"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Constant-time elliptic-curve arithmetic: Ed25519, X25519, P-256, P-384 (BLS12-381 in progress)."
readme = "README.md"
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-crypto-curve"
keywords = ["crypto", "ecc", "ed25519", "x25519", "no-std"]
categories = ["cryptography", "no-std"]

[dependencies]
tpt-crypto-field = { workspace = true }
tpt-crypto-ct = { workspace = true }
tpt-crypto-hash = { workspace = true }
tpt-crypto-core = { workspace = true }

[dev-dependencies]
hex = "0.4"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true
